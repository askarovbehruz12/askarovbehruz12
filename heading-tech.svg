<svg xmlns="http://www.w3.org/2000/svg" width="260" height="64" viewBox="0 0 260 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="ul" x1="0" x2="1"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#3776AB"/></linearGradient>
<clipPath id="rev"><rect class="rv" x="0" y="0" width="0" height="64"/></clipPath>
</defs>
<style>
.rv{animation:reveal 5s ease-in-out infinite}
.ln{animation:line 5s ease-in-out infinite;transform-origin:left}
.tx{fill:#2fb4f2}
.bob{animation:bob 2s ease-in-out infinite;transform-origin:26px 30px}
.spin{animation:spin 6s linear infinite;transform-origin:26px 30px}
.sway{animation:sway 2.2s ease-in-out infinite;transform-origin:26px 40px}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes reveal{0%{width:0}35%,85%{width:260px}100%{width:0}}
@keyframes line{0%,10%{transform:scaleX(0)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.6}}
</style>
<g class="spin"><circle cx="26" cy="30" r="12" fill="none" stroke="#8aa0b8" stroke-width="7" stroke-dasharray="5 5.4"/><circle cx="26" cy="30" r="10" fill="#8aa0b8"/><circle cx="26" cy="30" r="4" fill="#0d1117"/></g>
<g clip-path="url(#rev)"><text class="tx" x="62" y="39" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Tech Stack</text></g>
<rect class="ln" x="0" y="54" width="260" height="3" rx="1.5" fill="url(#ul)"/>
</svg>