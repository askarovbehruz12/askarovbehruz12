<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0" stop-color="#0f0c29"/><stop offset=".35" stop-color="#302b63"/><stop offset=".7" stop-color="#0a4a7a"/><stop offset="1" stop-color="#0f0c29"/>
</linearGradient>
<clipPath id="card"><rect width="900" height="260" rx="16"/></clipPath>
<clipPath id="type"><rect class="ty" x="0" y="150" width="0" height="40"/></clipPath>
</defs>
<style>
.bgm{animation:bgm 10s linear infinite}
.w1{animation:wave 7s linear infinite}
.w2{animation:wave 11s linear infinite reverse}
.st{animation:tw 2.6s ease-in-out infinite}
.nm{animation:glow 3s ease-in-out infinite}
.wl{animation:fade 1.2s ease-out both}
.ty{animation:typing 6s steps(34) infinite}
.cur{animation:blink 1s steps(1) infinite}
@keyframes bgm{from{transform:translateX(0)}to{transform:translateX(-900px)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-900px)}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(0,212,255,.3))}50%{filter:drop-shadow(0 0 14px rgba(0,212,255,.9))}}
@keyframes fade{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes typing{0%{width:0}60%,90%{width:520px}100%{width:0}}
@keyframes blink{50%{opacity:0}}
</style>
<g clip-path="url(#card)">
 <g class="bgm"><rect width="1800" height="260" fill="url(#bg)"/><rect x="900" width="900" height="260" fill="url(#bg)"/></g>
 <circle class="st" cx="60" cy="40" r="1.5" fill="#00d4ff" style="animation-delay:0.00s"/><circle class="st" cx="150" cy="200" r="2.5" fill="#00d4ff" style="animation-delay:0.37s"/><circle class="st" cx="260" cy="60" r="3.5" fill="#00d4ff" style="animation-delay:0.74s"/><circle class="st" cx="380" cy="220" r="1.5" fill="#00d4ff" style="animation-delay:1.11s"/><circle class="st" cx="520" cy="35" r="2.5" fill="#00d4ff" style="animation-delay:1.48s"/><circle class="st" cx="640" cy="210" r="3.5" fill="#00d4ff" style="animation-delay:1.85s"/><circle class="st" cx="760" cy="55" r="1.5" fill="#00d4ff" style="animation-delay:2.22s"/><circle class="st" cx="840" cy="190" r="2.5" fill="#00d4ff" style="animation-delay:2.59s"/><circle class="st" cx="110" cy="120" r="3.5" fill="#00d4ff" style="animation-delay:2.96s"/><circle class="st" cx="700" cy="120" r="1.5" fill="#00d4ff" style="animation-delay:3.33s"/><circle class="st" cx="450" cy="130" r="2.5" fill="#00d4ff" style="animation-delay:3.70s"/><circle class="st" cx="820" cy="110" r="3.5" fill="#00d4ff" style="animation-delay:4.07s"/>
 <text class="wl" x="450" y="52" text-anchor="middle" fill="#cfe3ff" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">WELCOME TO BEHRUZ'S GITHUB PROFILE</text>
 <text class="nm" x="450" y="130" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="62" font-weight="800">Askarov Behruz</text>
 <g clip-path="url(#type)"><text x="450" y="176" text-anchor="middle" fill="#00d4ff" font-family="Courier New,monospace" font-size="22" font-weight="700" letter-spacing="2">JUNIOR DEVELOPER | CREATIVE CODER</text></g>
 <g opacity=".35"><g class="w1"><path d="M0 225 Q225 195 450 225 T900 225 T1350 225 T1800 225 V260 H0Z" fill="#00d4ff"/></g></g>
 <g opacity=".25"><g class="w2"><path d="M0 238 Q225 214 450 238 T900 238 T1350 238 T1800 238 V260 H0Z" fill="#b44bff"/></g></g>
</g>
<rect x="1" y="1" width="898" height="258" rx="16" fill="none" stroke="#00d4ff" stroke-opacity=".5"/>
</svg>