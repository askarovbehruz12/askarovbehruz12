<svg xmlns="http://www.w3.org/2000/svg" width="700" height="150" viewBox="0 0 700 150" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d8d"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <style>
      .bg{fill:#0d1117}
      text{font-family:Segoe UI,Arial,sans-serif;font-weight:800}
      .box{fill:#111823;stroke-width:1.5;animation:glow 2.6s ease-in-out infinite}
      .ping{fill:none;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
      .pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.2,1.6,.4,1) backwards}
      .ico{transform-box:fill-box;transform-origin:center;animation:float 3s ease-in-out infinite}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
      .beat{transform-box:fill-box;transform-origin:center;animation:beat 1.6s ease-in-out infinite}
      .ln{stroke-dasharray:380;animation:draw 3.5s ease-in-out infinite alternate}
      .run{stroke-dasharray:70 630;animation:run 4s linear infinite}
      .st{animation:twinkle 2s ease-in-out infinite}
      .p{animation:rise 5s ease-in infinite}
      @keyframes pop{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes glow{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
      @keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.35);opacity:0}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
      @keyframes draw{from{stroke-dashoffset:380}to{stroke-dashoffset:0}}
      @keyframes run{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
      @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
      @keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-70px);opacity:0}}
    </style>
  </defs>
  <rect class="bg" width="700" height="150" rx="12"/>

  <!-- particles -->
  <circle class="p" cx="120" cy="125" r="1.6" fill="#00e5ff"/>
  <circle class="p" cx="260" cy="130" r="1.4" fill="#ff4d8d" style="animation-delay:1.2s"/>
  <circle class="p" cx="400" cy="126" r="1.6" fill="#8b5cf6" style="animation-delay:2.4s"/>
  <circle class="p" cx="540" cy="130" r="1.4" fill="#ffd43b" style="animation-delay:.6s"/>
  <circle class="p" cx="640" cy="124" r="1.6" fill="#00e5ff" style="animation-delay:3.2s"/>
  <circle class="st" cx="650" cy="26" r="2" fill="#00e5ff"/>
  <circle class="st" cx="672" cy="44" r="1.5" fill="#b44cff" style="animation-delay:.6s"/>
  <circle class="st" cx="628" cy="46" r="1.5" fill="#ff4d8d" style="animation-delay:1.2s"/>

  <text x="24" y="30" font-size="15" fill="#c9d1d9">🛠 Texnologiyalar</text>
  <path class="ln" d="M24 40H404" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>

  <!-- 1 JavaScript -->
  <g transform="translate(24,58)"><g class="pop" style="animation-delay:.0s"><g class="ico">
    <rect class="box" width="60" height="60" rx="10" stroke="#f7df1e"/>
    <rect class="ping" width="60" height="60" rx="10" stroke="#f7df1e"/>
    <rect x="15" y="15" width="30" height="30" fill="#f7df1e"/>
    <text x="42" y="42" font-size="14" text-anchor="end" fill="#111">JS</text>
  </g></g></g>
  <!-- 2 Python -->
  <g transform="translate(98,58)"><g class="pop" style="animation-delay:.12s"><g class="ico" style="animation-delay:.25s">
    <rect class="box" width="60" height="60" rx="10" stroke="#3b82c4" style="animation-delay:.25s"/>
    <rect class="ping" width="60" height="60" rx="10" stroke="#3b82c4" style="animation-delay:.25s"/>
    <g transform="translate(30,30)">
      <rect x="-14" y="-14" width="20" height="17" rx="6" fill="#3776ab"/>
      <rect x="-6" y="-3" width="20" height="17" rx="6" fill="#ffd43b"/>
      <circle cx="-8" cy="-9" r="1.6" fill="#fff"/><circle cx="8" cy="9" r="1.6" fill="#333"/>
    </g>
  </g></g></g>
  <!-- 3 React -->
  <g transform="translate(172,58)"><g class="pop" style="animation-delay:.24s"><g class="ico" style="animation-delay:.5s">
    <rect class="box" width="60" height="60" rx="10" stroke="#61dafb" style="animation-delay:.5s"/>
    <rect class="ping" width="60" height="60" rx="10" stroke="#61dafb" style="animation-delay:.5s"/>
    <g transform="translate(30,30)">
      <g class="spin" stroke="#61dafb" stroke-width="1.8">
        <ellipse rx="14" ry="5.5"/>
        <ellipse rx="14" ry="5.5" transform="rotate(60)"/>
        <ellipse rx="14" ry="5.5" transform="rotate(120)"/>
      </g>
      <circle class="beat" r="2.8" fill="#61dafb"/>
    </g>
  </g></g></g>
  <!-- 4 HTML5 -->
  <g transform="translate(246,58)"><g class="pop" style="animation-delay:.36s"><g class="ico" style="animation-delay:.75s">
    <rect class="box" width="60" height="60" rx="10" stroke="#e44d26" style="animation-delay:.75s"/>
    <rect class="ping" width="60" height="60" rx="10" stroke="#e44d26" style="animation-delay:.75s"/>
    <g transform="translate(30,30)">
      <path d="M-13-14H13L11 11 0 15-11 11Z" fill="#e44d26"/>
      <path d="M0-12H11.2L9.5 9.5 0 12.5Z" fill="#f16529"/>
      <text x="0" y="7" font-size="17" text-anchor="middle" fill="#fff">5</text>
    </g>
  </g></g></g>
  <!-- 5 CSS3 -->
  <g transform="translate(320,58)"><g class="pop" style="animation-delay:.48s"><g class="ico" style="animation-delay:1s">
    <rect class="box" width="60" height="60" rx="10" stroke="#1572b6" style="animation-delay:1s"/>
    <rect class="ping" width="60" height="60" rx="10" stroke="#1572b6" style="animation-delay:1s"/>
    <g transform="translate(30,30)">
      <path d="M-13-14H13L11 11 0 15-11 11Z" fill="#1572b6"/>
      <path d="M0-12H11.2L9.5 9.5 0 12.5Z" fill="#33a9dc"/>
      <text x="0" y="7" font-size="17" text-anchor="middle" fill="#fff">3</text>
    </g>
  </g></g></g>
  <!-- 6 Git -->
  <g transform="translate(394,58)"><g class="pop" style="animation-delay:.6s"><g class="ico" style="animation-delay:1.25s">
    <rect class="box" width="60" height="60" rx="10" stroke="#f05133" style="animation-delay:1.25s"/>
    <rect class="ping" width="60" height="60" rx="10" stroke="#f05133" style="animation-delay:1.25s"/>
    <g transform="translate(30,30)">
      <rect x="-11" y="-11" width="22" height="22" rx="3" fill="#f05133" transform="rotate(45)"/>
      <path d="M-2-5V5M-2-1L4 1.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-2" cy="-5" r="2.2" fill="#fff"/><circle cx="-2" cy="5" r="2.2" fill="#fff"/><circle cx="4" cy="1.5" r="2.2" fill="#fff"/>
    </g>
  </g></g></g>
  <!-- 7 GitHub -->
  <g transform="translate(468,58)"><g class="pop" style="animation-delay:.72s"><g class="ico" style="animation-delay:1.5s">
    <rect class="box" width="60" height="60" rx="10" stroke="#8b949e" style="animation-delay:1.5s"/>
    <rect class="ping" width="60" height="60" rx="10" stroke="#8b949e" style="animation-delay:1.5s"/>
    <g transform="translate(30,30)">
      <circle r="14" fill="#f0f6fc"/>
      <path d="M-7-3L-8-10-3-7Q0-8 3-7L8-10 7-3Q9 0 7 4Q4 9 0 9-4 9-7 4-9 0-7-3Z" fill="#0d1117"/>
    </g>
  </g></g></g>
  <!-- 8 VS Code -->
  <g transform="translate(542,58)"><g class="pop" style="animation-delay:.84s"><g class="ico" style="animation-delay:1.75s">
    <rect class="box" width="60" height="60" rx="10" stroke="#2aa5f5" style="animation-delay:1.75s"/>
    <rect class="ping" width="60" height="60" rx="10" stroke="#2aa5f5" style="animation-delay:1.75s"/>
    <g transform="translate(30,30)">
      <path d="M14-11L9-13-4-1-11-7-14-5V5L-11 7-4 1 9 13 14 11Z" fill="#2aa5f5"/>
      <path d="M9-8L0 0 9 8Z" fill="#111823"/>
    </g>
  </g></g></g>

  <!-- bottom line -->
  <path d="M24 136H676" stroke="#21262d" stroke-width="1.5"/>
  <path class="run" d="M24 136H676" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
</svg>
