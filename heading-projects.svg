<svg xmlns="http://www.w3.org/2000/svg" width="330" height="64" viewBox="0 0 330 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="ul" x1="0" x2="1"><stop offset="0" stop-color="#ff4f8b"/><stop offset="1" stop-color="#b44bff"/></linearGradient>
<clipPath id="rev"><rect class="rv" x="0" y="0" width="0" height="64"/></clipPath>
</defs>
<style>
.rv{animation:reveal 5s ease-in-out infinite}
.ln{animation:line 5s ease-in-out infinite;transform-origin:left}
.tx{fill:#ff5c93}
.bob{animation:bob 2s ease-in-out infinite;transform-origin:26px 30px}
.spin{animation:spin 6s linear infinite;transform-origin:26px 30px}
.sway{animation:sway 2.2s ease-in-out infinite;transform-origin:26px 40px}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes reveal{0%{width:0}35%,85%{width:330px}100%{width:0}}
@keyframes line{0%,10%{transform:scaleX(0)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.6}}
</style>
<g class="sway"><circle cx="26" cy="16" r="9" fill="#ff4f8b"/><rect x="22" y="22" width="8" height="8" fill="#ff4f8b"/><rect x="16" y="29" width="20" height="4" rx="2" fill="#d13a6f"/><line x1="26" y1="33" x2="26" y2="46" stroke="#cfd6e0" stroke-width="3" stroke-linecap="round"/></g>
<g clip-path="url(#rev)"><text class="tx" x="62" y="39" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Recent Projects</text></g>
<rect class="ln" x="0" y="54" width="330" height="3" rx="1.5" fill="url(#ul)"/>
</svg>