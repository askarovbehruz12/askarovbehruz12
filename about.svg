<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d4ff"/><stop offset=".5" stop-color="#b44bff"/><stop offset="1" stop-color="#ff4f8b"/></linearGradient>
<clipPath id="tg"><rect class="ty" x="44" y="26" width="0" height="34"/></clipPath>
</defs>
<style>
.ln{opacity:0;animation:in .8s ease-out forwards}
.ty{animation:typing 1.4s steps(46) .3s forwards}
.cur{animation:blink 1s steps(1) infinite}
.bd{stroke-dasharray:260 1200;animation:run 6s linear infinite}
.dot{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes typing{to{width:450px}}
@keyframes blink{50%{opacity:0}}
@keyframes run{to{stroke-dashoffset:-1460}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
</style>
<rect x="1" y="1" width="818" height="248" rx="16" fill="#0d131c"/>
<rect x="1" y="1" width="818" height="248" rx="16" fill="none" stroke="#00d4ff" stroke-opacity=".25"/>
<rect class="bd" x="1" y="1" width="818" height="248" rx="16" fill="none" stroke="url(#bd)" stroke-width="2.5" stroke-linecap="round"/>
<rect x="24" y="22" width="480" height="38" rx="8" fill="#1b2433"/>
<circle class="dot" cx="42" cy="41" r="5" fill="#3fb950"/>
<g clip-path="url(#tg)"><text x="56" y="46" fill="#7ee7ff" font-family="Courier New,monospace" font-size="15" font-weight="700">Junior Developer (Python / JavaScript / React)</text></g>
<text class="ln" x="32" y="112" style="animation-delay:1.60s" fill="#d6e0ee" font-family="Segoe UI,Arial,sans-serif" font-size="16">Men Python, JavaScript va React.js bilan ishlaydigan yosh dasturchiman.</text><text class="ln" x="32" y="140" style="animation-delay:2.15s" fill="#d6e0ee" font-family="Segoe UI,Arial,sans-serif" font-size="16">Loyihalarni noldan boshlab, rejalashtirishdan tortib to tayyor mahsulotgacha</text><text class="ln" x="32" y="168" style="animation-delay:2.70s" fill="#d6e0ee" font-family="Segoe UI,Arial,sans-serif" font-size="16">o'zim yaratishga harakat qilaman. Telegram botlar yaratish va web saytlar</text><text class="ln" x="32" y="196" style="animation-delay:3.25s" fill="#d6e0ee" font-family="Segoe UI,Arial,sans-serif" font-size="16">qilish menga yoqadi. Har kuni yangi narsa o'rganib, o'z dunyoqarashimni</text><text class="ln" x="32" y="224" style="animation-delay:3.80s" fill="#d6e0ee" font-family="Segoe UI,Arial,sans-serif" font-size="16">kod orqali kengaytirib boraman.</text>
<rect class="cur" x="264.5" y="210" width="9" height="18" fill="#00d4ff"/>
</svg>