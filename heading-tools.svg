<svg xmlns="http://www.w3.org/2000/svg" width="460" height="64" viewBox="0 0 460 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="ul" x1="0" x2="1"><stop offset="0" stop-color="#ff4f8b"/><stop offset="1" stop-color="#00d4ff"/></linearGradient>
<clipPath id="rev"><rect class="rv" x="0" y="0" width="0" height="64"/></clipPath>
</defs>
<style>
.ic{animation:bob 2s ease-in-out infinite;transform-origin:26px 30px}
.rv{animation:reveal 5s ease-in-out infinite}
.ln{animation:line 5s ease-in-out infinite;transform-origin:left}
.cl{animation:clasp 2s ease-in-out infinite}
.tx{fill:#e6edf3}@media (prefers-color-scheme: light){.tx{fill:#1f2328}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-4px) rotate(-6deg)}75%{transform:translateY(-4px) rotate(6deg)}}
@keyframes reveal{0%{width:0}35%,85%{width:460px}100%{width:0}}
@keyframes line{0%,10%{transform:scaleX(0)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes clasp{0%,100%{opacity:1}50%{opacity:.4}}
</style>
<g class="ic">
 <path d="M18 18v-3a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3" fill="none" stroke="#ff4f8b" stroke-width="3" stroke-linecap="round"/>
 <rect x="8" y="18" width="36" height="26" rx="5" fill="#ff4f8b"/>
 <rect x="8" y="28" width="36" height="3" fill="#b8325f"/>
 <rect class="cl" x="23" y="25" width="6" height="9" rx="2" fill="#ffd6e4"/>
</g>
<g clip-path="url(#rev)">
 <text class="tx" x="62" y="39" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Languages and Tools</text>
</g>
<rect class="ln" x="0" y="54" width="460" height="3" rx="1.5" fill="url(#ul)"/>
</svg>